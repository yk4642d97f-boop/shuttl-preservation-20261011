name: UploadRelaunchSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  UploadRelaunchSmoke:
    type: application
    platform: iOS
    sources:
      - SmokeApp.swift
      - ../../../../ios/Sources/Services/Network/VideoUploadService.swift
      - ../../../../ios/Sources/Services/Network/UploadTransport.swift
      - ../../../../ios/Sources/Core/Storage/VideoStore.swift
      - ../../../../ios/Sources/App/Orientation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycyangcong.shuttl.uploadsmoke
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_FILE: Info.plist
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  UploadRelaunchSmoke:
    build:
      targets:
        UploadRelaunchSmoke: all
